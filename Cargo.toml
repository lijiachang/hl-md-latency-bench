[package]
name = "hl-md-latency-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
url = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
ctrlc = "3"
libc = "0.2"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1.43", features = ["rt", "time"] }
tonic = { version = "0.10.2", features = ["transport", "tls", "tls-webpki-roots", "gzip"] }
prost = "0.12"

[build-dependencies]
tonic-build = "0.10.2"

[profile.release]
lto = true
